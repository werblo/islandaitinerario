name: Confronto meteo

# Quale previsione ci azzecca di più a Reykjavík e Keflavík (nuvole, pioggia, vento, raffiche):
# vedur.is? Chiesto da Michele l'8/11; risultati per il controllo del 14/11.
# Ogni esecuzione salva le previsioni ora per ora dei prossimi giorni e le confronta con il tempo
# osservato all'aeroporto di Reykjavík (METAR). Risultati: riepilogo di ogni esecuzione (tab
# Actions) e artifact "confronto-meteo". Non tocca il sito né gli avvisi.
on:
  schedule:
    - cron: '41 */3 8-14 11 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confronto-meteo

jobs:
  confronto:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: confronto-meteo
          key: confronto-meteo-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: confronto-meteo-
      - name: Salva le previsioni
        run: python tools/meteo/confronto_meteo.py raccogli confronto-meteo
      - name: Confronta
        if: always()
        run: python tools/meteo/confronto_meteo.py valuta confronto-meteo
      - uses: actions/cache/save@v4
        if: always() && hashFiles('confronto-meteo/previsioni.csv') != ''
        with:
          path: confronto-meteo
          key: confronto-meteo-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('confronto-meteo/previsioni.csv') != ''
        with:
          name: confronto-meteo
          path: confronto-meteo
          retention-days: 90
