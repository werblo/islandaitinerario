name: Avvisi aurora

# Orari UTC = ora islandese.
# - Mattino: alle 7:15 dal 15 al 21 novembre (GitHub parte spesso con qualche
#   minuto di ritardo: la notifica arriva verso le 7:30) com'è messa stasera.
# - Notte: ogni 30 minuti (ai minuti 7 e 37: allo scoccare dell'ora GitHub è più
#   carico e ritarda di più), 16:07-23:37 dal 15 al 21 novembre e 00:07-03:37
#   dal 16 al 22 novembre; lo script non fa niente fuori dalle date del viaggio.
# Attenzione: la riga AURORA_MODE più sotto confronta il testo esatto dei cron
# del mattino e della prova: se li cambi, cambiali anche lì.
# - Prova automatica: il 13 novembre alle 18:07 (19:07 in Italia) una notifica di
#   prova a tutti i telefoni, per controllare che arrivino prima di partire.
# A mano (tab Actions -> "Avvisi aurora" -> Run workflow): "prova" manda subito
# una notifica di prova, "mattino" un'anteprima del messaggio del mattino.
on:
  schedule:
    - cron: '7,37 16-23 15-21 11 *'
    - cron: '7,37 0-3 16-22 11 *'
    - cron: '15 7 15-21 11 *'
    - cron: '7 18 13 11 *'
  workflow_dispatch:
    inputs:
      modalita:
        description: 'prova = notifica subito · mattino = anteprima del messaggio delle 7:30 · controllo = come di notte'
        type: choice
        options: [prova, mattino, controllo]
        default: prova

permissions:
  contents: read

concurrency:
  group: avvisi-aurora

jobs:
  aurora:
    runs-on: ubuntu-24.04   # fisso: ubuntu-latest passa a una nuova versione a metà ottobre 2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pywebpush==2.5.0
      # avvisi già inviati per notte (al massimo uno per tipo): cache, niente commit nel repo
      - uses: actions/cache/restore@v4
        with:
          path: .aurora-state
          key: aurora-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: aurora-state-
      - name: Controlla l'aurora e manda gli avvisi
        run: python tools/aurora_alert.py
        env:
          AURORA_MODE: ${{ github.event.schedule == '15 7 15-21 11 *' && 'mattino' || github.event.schedule == '7 18 13 11 *' && 'prova' || inputs.modalita || 'controllo' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          AURORA_SUBSCRIPTIONS: ${{ secrets.AURORA_SUBSCRIPTIONS }}
          AURORA_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.aurora-state/state.json') != ''
        with:
          path: .aurora-state
          key: aurora-state-${{ github.run_id }}-${{ github.run_attempt }}
