name: Avvisi aurora

# Orari UTC = ora islandese.
# GitHub fa partire le esecuzioni programmate anche con 4-12 ore di ritardo (misurato a
# ottobre 2026): per questo ogni esecuzione è un "turno" che resta acceso circa 5 ore e
# mezza e fa da solo, ai minuti :07 e :37,
#   - i controlli notturni (16:07-3:37, notti dal 15 al 21 novembre);
#   - il messaggio del mattino (dalle 7:37, dal 15 al 21 novembre);
#   - la prova automatica del 13 novembre dalle 18:07 (19:07 in Italia).
# I turni partono ogni 2 ore dal 13 al 22 novembre e si mettono in coda (concurrency):
# quando uno finisce parte quello in attesa, così le ore utili restano coperte anche se
# GitHub ritarda. Fuori dalle date del viaggio il turno non fa niente.
# A mano (tab Actions -> "Avvisi aurora" -> Run workflow): "prova" manda subito una
# notifica di prova, "mattino" un'anteprima del messaggio del mattino, "controllo" un
# controllo come di notte, "turno" un turno completo.
on:
  schedule:
    - cron: '7 */2 13-22 11 *'
  workflow_dispatch:
    inputs:
      modalita:
        description: 'prova = notifica subito · mattino = anteprima del messaggio delle 7:30 · controllo = come di notte · turno = 5 ore e mezza di controlli'
        type: choice
        options: [prova, mattino, controllo, turno]
        default: prova
      durata:
        description: 'solo per "turno": durata in minuti (massimo 330)'
        default: '330'

permissions:
  contents: read

# i turni programmati si mettono in coda uno dopo l'altro; le prove a mano partono subito
concurrency:
  group: avvisi-aurora-${{ github.event_name == 'schedule' && 'turno' || github.run_id }}

jobs:
  aurora:
    runs-on: ubuntu-24.04   # fisso: ubuntu-latest passa a una nuova versione a metà ottobre 2026
    timeout-minutes: 350   # il turno dura 330 minuti; GitHub ferma i job dopo 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pywebpush==2.5.0
      # avvisi già inviati per notte (al massimo uno per tipo): cache, niente commit nel repo
      - uses: actions/cache/restore@v4
        with:
          path: .aurora-state
          key: aurora-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: aurora-state-
      - name: Controlla l'aurora e manda gli avvisi
        run: python tools/aurora_alert.py
        env:
          PYTHONUNBUFFERED: '1'   # registro scritto man mano, non tutto alla fine del turno
          AURORA_MODE: ${{ github.event_name == 'schedule' && 'turno' || inputs.modalita || 'turno' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          AURORA_SUBSCRIPTIONS: ${{ secrets.AURORA_SUBSCRIPTIONS }}
          AURORA_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          AURORA_TURNO_MIN: ${{ inputs.durata || '330' }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.aurora-state/state.json') != ''
        with:
          path: .aurora-state
          key: aurora-state-${{ github.run_id }}-${{ github.run_attempt }}
