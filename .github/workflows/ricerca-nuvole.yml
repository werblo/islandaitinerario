name: Ricerca nuvole (prova)
on:
  push:
    branches: [claude/web-app-native-android-17reoa]
    paths: ['tools/research/**', '.github/workflows/ricerca-nuvole.yml']
permissions:
  contents: read
jobs:
  ricerca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/research/probe.py
